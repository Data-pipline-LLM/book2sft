x-generator-settings: &generator-settings
  SFT_TASK_SELECTION_POLICY: ${SFT_TASK_SELECTION_POLICY}
  SFT_TASK_FIDELITY_GUARD: ${SFT_TASK_FIDELITY_GUARD}
  SFT_MAX_SEMANTIC_TARGETS: ${SFT_MAX_SEMANTIC_TARGETS}
  SFT_PLANNER_MAX_TOKENS: ${SFT_PLANNER_MAX_TOKENS}
  SFT_ADAPTIVE_RESPONSE_PLANNING: ${SFT_ADAPTIVE_RESPONSE_PLANNING}
  SFT_RESPONSE_PLAN_MAX_TOKENS: ${SFT_RESPONSE_PLAN_MAX_TOKENS}
  SFT_GENERATION_MAX_TOKENS: ${SFT_GENERATION_MAX_TOKENS}
  SFT_GENERATION_TEMPERATURE: ${SFT_GENERATION_TEMPERATURE}
  SFT_RESPONSE_QUALITY_GATE: ${SFT_RESPONSE_QUALITY_GATE}
  SFT_RESPONSE_REVISE_MAX_TOKENS: ${SFT_RESPONSE_REVISE_MAX_TOKENS}
  SFT_TARGET_GENERATION_CONCURRENCY: ${SFT_TARGET_GENERATION_CONCURRENCY}
  SFT_GENERATION_GLOBAL_LLM_CONCURRENCY: ${SFT_GENERATION_GLOBAL_LLM_CONCURRENCY}
  SFT_LLM_MAX_ATTEMPTS: ${SFT_LLM_MAX_ATTEMPTS}
  SFT_LLM_RETRY_BASE_SEC: ${SFT_LLM_RETRY_BASE_SEC}
  SFT_LLM_RETRY_MAX_SEC: ${SFT_LLM_RETRY_MAX_SEC}
  SFT_UNIFIED_SEMANTIC_PLANNING: ${SFT_UNIFIED_SEMANTIC_PLANNING}
  SFT_UNIFIED_PLANNER_MAX_TOKENS: ${SFT_UNIFIED_PLANNER_MAX_TOKENS}
  SFT_ENABLE_GROUNDED_COMPOSITION: ${SFT_ENABLE_GROUNDED_COMPOSITION}
  SFT_USERLIKE_PERSIAN_QUESTIONS: ${SFT_USERLIKE_PERSIAN_QUESTIONS}
  SFT_UNIFIED_PLANNER_RECOVERY_RETRY: ${SFT_UNIFIED_PLANNER_RECOVERY_RETRY}
  REQUEST_TIMEOUT_SEC: ${REQUEST_TIMEOUT_SEC}

services:
  generator:
    environment: *generator-settings

  orchestrator:
    environment:
      VLLM_CHAT_URL: ${VLLM_CHAT_URL}
      REQUEST_TIMEOUT_SEC: ${REQUEST_TIMEOUT_SEC}
      TRANSLATION_EVALUATION_URL: http://quality:8000

  chunker:
    environment:
      CHUNKER_LLM_MODEL: ${CHUNKER_LLM_MODEL}
      CHUNKER_LLM_TIMEOUT: ${CHUNKER_LLM_TIMEOUT}
      CHUNKER_LLM_MAX_OUTPUT_TOKENS: ${CHUNKER_LLM_MAX_OUTPUT_TOKENS}
      CHUNKER_LLM_MAX_RETRIES: ${CHUNKER_LLM_MAX_RETRIES}
      ATOMIZER_OVERLAP_LINES: ${ATOMIZER_OVERLAP_LINES}
      PLANNER_OVERLAP_UNITS: ${PLANNER_OVERLAP_UNITS}
      JOB_WORKERS: ${JOB_WORKERS}


  assessment:
    environment:
      VLLM_BASE_URL: ${VLLM_BASE_URL}
      VLLM_MODEL_NAME: ${VLLM_MODEL_NAME}
      VLLM_API_KEY: ${VLLM_API_KEY}


  quality:
    environment:
      VLLM_BASE_URL: ${VLLM_BASE_URL}
      VLLM_MODEL_NAME: ${VLLM_MODEL_NAME}
      VLLM_API_KEY: ${VLLM_API_KEY}